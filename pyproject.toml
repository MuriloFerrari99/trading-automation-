[project]
name = "trading-automation"
version = "0.1.0"
description = "Sistema de automacao de investimentos (Alpaca paper trading) orquestrado por agentes."
readme = "BRIEFING.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.33",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "apscheduler>=3.10",
    "pyyaml>=6.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "config",
    "core",
    "data",
    "broker",
    "agents",
    "strategies",
    "orchestration",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
